# Les dispositifs — programmes de l'État et zonages —, une page chacun sous
# /dispositif/<id> (docs/13-programmes-et-zonages.md, décisions du
# 13 novembre 2026).
#
# Écrit à la main, d'après les sources citées, lues à la date de
# `consulte_le`. Chaque phrase porte la source d'où elle vient (`source:`).
# La liste des communes n'est pas ici : elle vient des fichiers de zonage
# (`scripts/zonages-emettre.ts`), par la clé `cle`.
#
# Deux choses à ne pas mêler, et que la page sépare :
#   — `evaluations` : ce que concluent les évaluations publiées, citées
#     telles qu'elles l'écrivent ;
#   — les séries que le site calcule sur les communes du dispositif, qui
#     décrivent et ne mesurent pas l'effet (src/modele/dispositifs.ts).
#
# Aucune personne physique n'est nommée : un rapport se cite par
# l'institution qui l'a adopté, pas par ses rapporteurs.
dispositifs:
  - id: petites-villes-de-demain
    cle: pvd
    nom: "Petites villes de demain"
    nature: programme
    lancement: 2020
    pilote: "L'Agence nationale de la cohésion des territoires (ANCT)"
    resume: "Un programme de l'État, lancé en 2020, pour aider des communes de moins de 20 000 habitants qui jouent un rôle de centralité à revitaliser leur centre : surtout de l'ingénierie, autour d'un chef de projet."
    ce_que_cest:
      - texte: "Lancé en octobre 2020 et piloté par l'ANCT, le programme soutient des communes de moins de 20 000 habitants ayant un rôle clé pour la dynamique locale, pour revitaliser leur centre-ville, améliorer leur attractivité et renforcer les services aux habitants. L'ANCT l'annonce pensé jusqu'en décembre 2026."
        source: anct-pvd
      - texte: "Il est né en 2020 comme volet de l'Agenda rural, sur le modèle d'Action cœur de ville, qui s'adresse aux villes moyennes."
        source: senat-pvd-2025
    qui_decide:
      - texte: "1 646 communes ont été retenues sur proposition des préfets de département."
        source: senat-pvd-2025
      - texte: "Le programme soutient ces communes et leurs intercommunalités."
        source: anct-pvd
      - texte: "Le programme repose sur une démarche ascendante : chaque commune élabore son propre projet de revitalisation, plutôt que de répondre à un appel à projets."
        source: senat-pvd-2025
    apporte:
      - texte: "Un chef de projet, chargé de piloter l'élaboration et la mise en œuvre du projet de revitalisation, dont l'État finance le poste dans la limite de 75 % de son coût annuel."
        source: senat-pvd-2025
      - texte: "Un appui en ingénierie et la mobilisation de partenaires nationaux — la Banque des Territoires, l'Agence nationale de l'habitat, le Cerema, l'Ademe —, et l'animation d'un club des communes du programme."
        source: anct-pvd
      - texte: "Pas d'enveloppe propre pour l'investissement : le Sénat relève « l'absence d'enveloppe financière consacrée à l'investissement dans les projets ayant émergé du programme »."
        source: senat-pvd-2025
    cout:
      - texte: "L'ANCT écrit que 4 milliards d'euros sont engagés jusqu'en 2026 pour soutenir la revitalisation des petites centralités."
        source: anct-pvd
      - texte: "Le Sénat relève qu'à son lancement, une enveloppe de trois milliards d'euros sur six ans avait été annoncée, qui ne correspondait pas à des moyens supplémentaires mais à des dotations et fonds de droit commun lissés sur six ans — dont 1,47 milliard d'euros de crédits engagés par l'État —, et seulement à un soutien en ingénierie, pas à l'investissement des communes."
        source: senat-pvd-2025
    evaluations:
      - source: senat-pvd-2025
        conclusion: "« Le programme PVD a produit des résultats incontestablement positifs : il a permis d'outiller les communes dans la conception de projets structurants de territoire. » Ce bilan est « tempéré par quelques bémols, à commencer par l'absence d'enveloppe financière consacrée à l'investissement »."
    sources:
      - { id: anct-pvd, titre: "ANCT — Petites villes de demain, présentation du programme", url: "https://anct.gouv.fr/programmes-dispositifs/petites-villes-de-demain", consulte_le: 2026-11-13 }
      - { id: senat-pvd-2025, titre: "Sénat, commission de l'aménagement du territoire et du développement durable — rapport d'information « Petites villes de demain : mettre l'avenir au centre », adopté le 15 octobre 2025 (synthèse)", url: "https://www.senat.fr/rap/r25-040/r25-040-syn.pdf", consulte_le: 2026-11-13 }
    verifie_le: 2026-11-13

  - id: action-coeur-de-ville
    cle: acv
    nom: "Action cœur de ville"
    nature: programme
    lancement: 2018
    pilote: "L'Agence nationale de la cohésion des territoires (ANCT)"
    resume: "Un programme de l'État, lancé en 2018, pour les villes moyennes : améliorer la vie de leurs habitants et redonner de l'élan à leur centre, avec l'argent de l'État, de la Banque des territoires, de l'Anah et d'Action Logement."
    ce_que_cest:
      - texte: "Lancé en 2018 et piloté par l'ANCT, le programme veut améliorer les conditions de vie des habitants des villes moyennes et conforter leur rôle de moteur du développement de leur territoire."
        source: anct-acv
      - texte: "Il cible des centres-villes confrontés à une dégradation des conditions de logement, au départ des commerces et des équipements, et à celui de leurs habitants vers la périphérie."
        source: cc-acv-2022
    qui_decide:
      - texte: "222 villes ou binômes de villes ont été sélectionnés le 26 mars 2018, sur proposition du ministère de l'Aménagement du territoire, avec l'accord d'un comité national. L'ANCT compte 244 communes lauréates en 2025, dont une dizaine en outre-mer."
        source: anct-acv
      - texte: "Une deuxième phase, de 2023 à 2026, élargit le programme aux entrées de ville et aux quartiers de gare."
        source: anct-acv
    apporte:
      - texte: "Cinq axes : l'habitat ; un développement économique et commercial équilibré ; l'accessibilité et les mobilités ; l'aménagement de l'espace urbain et la mise en valeur du patrimoine ; un socle de services dans chaque ville."
        source: anct-acv
      - texte: "Des financements de partenaires : la Caisse des dépôts, l'Agence nationale de l'habitat, qui aide à rénover les logements anciens, et Action Logement, qui finance la rénovation et la construction de logements dans les centres."
        source: anct-acv
    cout:
      - texte: "Selon la Cour des comptes, l'État et ses trois partenaires se sont engagés à consacrer au programme 5 milliards d'euros, dont 600 millions d'effort budgétaire de l'État : c'est la mobilisation de la Banque des territoires, d'Action Logement et de l'Anah, 4,4 milliards, qui en constitue le cœur."
        source: cc-acv-2022
      - texte: "La Cour ajoute qu'une partie des 5 milliards annoncés ne sera pas engagée à l'échéance prévue, que les opérateurs ont pu consacrer au programme d'autres moyens non spécifiquement fléchés, et qu'il n'existe pas d'état précis des autres financements, ceux des collectivités notamment."
        source: cc-acv-2022
    evaluations:
      - source: cc-acv-2022
        conclusion: "Le programme « s'avère ambitieux et innovant » et « a créé une réelle dynamique, en facilitant le développement de projets structurants soutenus par les maires ». Mais « les indicateurs actuels ne permettent cependant pas d'établir précisément l'impact du programme » : il « demeure difficile de faire la part entre les effets d'ACV et le produit d'évolutions sociétales plus profondes entraînant un regain d'attrait pour les villes moyennes »."
    sources:
      - { id: anct-acv, titre: "ANCT — Action cœur de ville, présentation du programme", url: "https://anct.gouv.fr/programmes-dispositifs/action-coeur-de-ville", consulte_le: 2026-11-13 }
      - { id: cc-acv-2022, titre: "Cour des comptes — Le programme Action cœur de ville, 29 septembre 2022", url: "https://www.ccomptes.fr/fr/publications/le-programme-action-coeur-de-ville", consulte_le: 2026-11-13 }
    verifie_le: 2026-11-13

  - id: villages-d-avenir
    cle: va
    nom: "Villages d'avenir"
    nature: programme
    lancement: 2023
    pilote: "L'Agence nationale de la cohésion des territoires (ANCT)"
    resume: "Un programme de l'État, lancé fin 2023, qui accompagne des communes rurales de moins de 3 500 habitants dans leurs projets : un chef de projet de l'État, et l'orientation vers les aides existantes."
    ce_que_cest:
      - texte: "Lancé en décembre 2023 dans le cadre du plan France ruralités et piloté par l'ANCT, le programme accompagne des communes rurales au sens de l'INSEE, de moins de 3 500 habitants, dans leurs projets de développement. Il complète les autres programmes d'ingénierie de l'État, dont Petites villes de demain et Action cœur de ville."
        source: anct-va
      - texte: "Le Gouvernement a annoncé le 10 juillet 2026 sa poursuite sur l'ensemble du mandat municipal commencé en 2026."
        source: gouv-va-2026
    qui_decide:
      - texte: "Le corps préfectoral identifie les communes, avec les conseils départementaux et régionaux."
        source: anct-va
      - texte: "Depuis la troisième phase, annoncée en 2026, le préfet devient le guichet unique d'orientation des collectivités."
        source: gouv-va-2026
    apporte:
      - texte: "Un accompagnement en ingénierie par 120 chefs de projet recrutés depuis 2024, placés en préfecture, en sous-préfecture et dans les directions départementales des territoires, dont des binômes dans les 25 départements les plus ruraux et 20 directeurs de projet financés par le Cerema."
        source: anct-va
      - texte: "Une orientation vers les dispositifs et aides existants de l'État et des autres financeurs, pour des projets de services de proximité, de réhabilitation de bâtiments, de réaménagement de centre-bourg, culturels ou touristiques."
        source: anct-va
    cout:
      - texte: "Aucune des sources lues ne chiffre son coût : le programme finance de l'ingénierie, et les projets passent par les aides existantes."
        source: anct-va
    sans_evaluation: "Aucune évaluation publiée trouvée le 13 novembre 2026 : le programme a moins de trois ans."
    sources:
      - { id: anct-va, titre: "ANCT — Villages d'avenir, présentation du programme", url: "https://anct.gouv.fr/programmes-dispositifs/villages-d-avenir", consulte_le: 2026-11-13 }
      - { id: gouv-va-2026, titre: "Ministères de l'Aménagement du territoire — « Le programme Villages d'avenir pérennisé », 21 juillet 2026", url: "https://www.ecologie.gouv.fr/actualites/programme-villages-davenir-perennise", consulte_le: 2026-11-13 }
    verifie_le: 2026-11-13

  - id: zonage-abc
    cle: abc
    nom: "Le zonage ABC"
    nature: zonage
    lancement: 2003
    pilote: "Le ministère chargé du logement"
    resume: "Un classement de toutes les communes selon la tension de leur marché du logement — A bis, A, B1, B2, C —, qui décide où s'appliquent certaines aides au logement et avec quels plafonds."
    classes:
      - { cle: "A BIS", libelle: "Zone A bis" }
      - { cle: "A", libelle: "Zone A" }
      - { cle: "B1", libelle: "Zone B1" }
      - { cle: "B2", libelle: "Zone B2" }
      - { cle: "C", libelle: "Zone C" }
    ce_que_cest:
      - texte: "Défini à l'article D. 304-1 du code de la construction et de l'habitation, le zonage classe les communes « en fonction du déséquilibre entre l'offre et de la demande de logements ». Par ordre décroissant de tension : A bis, A, B1, B2 et C. La zone A bis est incluse dans la zone A ; B1 et B2 forment la zone B."
        source: min-abc
      - texte: "Créé en 2003 pour le dispositif d'investissement locatif dit « Robien », il a été refondu en 2006, 2009 et 2014."
        source: min-abc
    qui_decide:
      - texte: "Il est révisé par arrêté : six révisions partielles depuis 2019, les dernières par les arrêtés du 5 septembre 2025, qui a reclassé 468 communes, et du 23 juin 2026."
        source: min-abc
      - texte: "La tension se mesure par les dynamiques du territoire — bassins de vie, démographie — et par des indicateurs, notamment les prix de l'immobilier et le niveau des loyers."
        source: min-abc
    apporte:
      - texte: "Rien par lui-même : il fixe le périmètre et les barèmes — plafonds de loyer, plafonds de ressources — d'aides qui s'en servent : l'investissement locatif (Denormandie, Loc'Avantages), l'accession à la propriété (prêt social location-accession, prêt à taux zéro, TVA à taux réduit en zone de rénovation urbaine et en quartier prioritaire, bail réel solidaire), le logement locatif intermédiaire, et les plafonds de loyer des logements sociaux financés en prêt locatif social."
        source: min-abc
      - texte: "Les zones A bis, A et B1 présentent un « déséquilibre important » entre l'offre et la demande, selon l'article 18-0 bis C de l'annexe 4 du code général des impôts ; certains dispositifs, comme le logement locatif intermédiaire pour les investisseurs institutionnels, ne valent que là."
        source: min-abc
    cout:
      - texte: "Le zonage n'a pas de budget propre : le ministère le présente comme le périmètre et le barème d'aides qui ont chacune le leur."
        source: min-abc
    sans_evaluation: "Aucune évaluation publiée du zonage lui-même n'a été trouvée le 13 novembre 2026 : ce sont les aides qui s'en servent qui s'évaluent."
    sources:
      - { id: min-abc, titre: "Ministère chargé du logement — « Zonage A, B, C », mis à jour le 3 juillet 2026", url: "https://www.ecologie.gouv.fr/politiques-publiques/zonage-b-c", consulte_le: 2026-11-13 }
    verifie_le: 2026-11-13

  - id: zone-de-montagne
    cle: montagne
    nom: "La zone de montagne"
    nature: zonage
    lancement: 1985
    pilote: "L'État, par arrêtés ministériels"
    resume: "La montagne a plusieurs délimitations officielles, qui ne coïncident pas : celle de l'urbanisme, où s'appliquent les règles de construction de la loi Montagne de 1985, et celle des zones agricoles défavorisées, qui ouvre droit à des aides aux agriculteurs."
    ce_que_cest:
      - texte: "Trois délimitations officielles de la montagne se superposent : les zones de montagne au titre du droit de l'urbanisme, soumises à la partie du code de l'urbanisme propre à la montagne ; les zones agricoles défavorisées de montagne, qui ouvrent droit à des aides ; et les massifs, base des comités de massif et de financements propres."
        source: ot-montagne
      - texte: "La loi Montagne du 9 janvier 1985 définit la zone de montagne comme des communes ou parties de communes caractérisées par « une limitation considérable des possibilités d'utilisation des terres et un accroissement important des coûts des travaux », dus à l'altitude, à la pente, ou aux deux. Ses règles d'urbanisme sont codifiées aux articles L. 122-1 et suivants du code de l'urbanisme."
        source: notaires-montagne
      - texte: "Cette page suit la première délimitation, celle de l'urbanisme ; chaque commune dit aussi sur sa page si elle est en zone agricole défavorisée de montagne."
        source: ot-montagne
    qui_decide:
      - texte: "Les communes en zone de montagne sont énumérées, de façon limitative, par l'arrêté interministériel du 6 septembre 1985 : environ 5 500 communes. Le décret du 16 janvier 2004 rattache chaque zone à un massif : Alpes, Corse, Massif central, Massif jurassien, Pyrénées, Massif vosgien."
        source: notaires-montagne
      - texte: "Le zonage agricole est constaté par des arrêtés conjoints du ministère de l'Agriculture et du ministère du Budget."
        source: ot-montagne
      - texte: "La loi fixe les règles, et le Parlement les révise : la loi de 2026 sur laquelle le Conseil constitutionnel s'est prononcé le 14 août 2026 a assoupli le principe de continuité, jugé conforme à la Constitution."
        source: cc-2026-912
    apporte:
      - texte: "Des règles d'urbanisme : l'extension de l'urbanisation doit, sauf exception, être réalisée en continuité des bourgs, villages, hameaux ou groupes de constructions existants."
        source: cc-2026-912
      - texte: "Depuis la loi de 2026, l'urbanisation peut se faire en continuité de groupes de constructions existants quelle que soit leur destination, et le principe de continuité intègre les coupures physiques — une voie, un cours d'eau, un talus — de faible importance."
        source: cc-2026-912
      - texte: "La capacité d'accueil des espaces destinés à l'urbanisation doit rester compatible avec la préservation des espaces, paysages et milieux caractéristiques du patrimoine naturel et culturel montagnard."
        source: cc-2026-912
      - texte: "Le code protège aussi les terres agricoles, pastorales et forestières, notamment dans les fonds de vallée, et encadre les unités touristiques nouvelles."
        source: notaires-montagne
      - texte: "En zone agricole défavorisée, les indemnités compensatoires de handicaps naturels sont versées aux agriculteurs qui y exploitent des surfaces ; en zone de montagne, les surfaces en production végétale doivent être commercialisées pour y ouvrir droit."
        source: telepac-ichn-2025
    cout:
      - texte: "La zone de montagne de l'urbanisme n'a pas de budget : elle fixe des règles."
        source: ot-montagne
      - texte: "Les indemnités compensatoires de handicaps naturels sont calculées par hectare de surfaces fourragères ou de cultures ; leurs montants varient selon la sous-zone défavorisée et sont définis par arrêté préfectoral."
        source: telepac-ichn-2025
    evaluations:
      - source: senat-montagne-2026
        conclusion: "La loi Montagne du 9 janvier 1985 et la loi Littoral du 3 janvier 1986 sont deux lois « cathédrales », dont le bilan est globalement très positif. […] La mission met en revanche deux bémols à ce bilan : d'une part, ces textes sont insuffisamment adaptés aux spécificités des territoires ; d'autre part, les difficultés d'application des règles d'urbanisme demeurent un irritant pour les acteurs locaux."
    sources:
      - { id: ot-montagne, titre: "Observatoire des territoires (ANCT) — « Montagne - zonage urbanisme »", url: "https://www.observatoire-des-territoires.gouv.fr/index.php/montagne-zonage-urbanisme", consulte_le: 2026-11-13 }
      - { id: notaires-montagne, titre: "Rapport du 120e congrès des notaires de France (2024) — « La montagne »", url: "https://www.rapport-congresdesnotaires.fr/2024-rapport-du-120e-congres/la-montagne", consulte_le: 2026-11-13 }
      - { id: cc-2026-912, titre: "Conseil constitutionnel — décision n° 2026-912 DC du 14 août 2026, considérants 13 à 20", url: "https://www.conseil-constitutionnel.fr/decision/2026/2026912DC.htm", consulte_le: 2026-11-13 }
      - { id: telepac-ichn-2025, titre: "Ministère de l'Agriculture — notice des indemnités compensatoires de handicaps naturels, dossier PAC 2025", url: "https://isis.telepac.agriculture.gouv.fr/telepac/pdf/tas/2025/Dossier-PAC-2025_notice_ICHN.pdf", consulte_le: 2026-11-13 }
      - { id: senat-montagne-2026, titre: "Sénat — rapport d'information n° 858 (2025-2026), « Loi Montagne, loi Littoral : face aux nouveaux enjeux, conforter, adapter et différencier », synthèse, 7 juillet 2026", url: "https://www.senat.fr/rap/r25-858/r25-858-syn.pdf", consulte_le: 2026-11-13 }
    verifie_le: 2026-11-13

  - id: france-ruralites-revitalisation
    cle: frr
    nom: "France ruralités revitalisation"
    nature: zonage
    lancement: 2024
    pilote: "La direction générale des collectivités locales, pour les ministères chargés de l'aménagement du territoire et du budget"
    resume: "Le zonage qui remplace depuis le 1er juillet 2024 les zones de revitalisation rurale : dans les communes rurales les plus fragiles, des exonérations d'impôts pour les entreprises qui s'y créent ou s'y reprennent, et d'autres avantages pour la commune."
    classes_nom: niveau
    liste: "la liste des communes de France ruralités revitalisation de la direction générale des collectivités locales"
    classes:
      - { cle: "1", libelle: "FRR « plus »" }
      - { cle: "2", libelle: "FRR « socle »" }
      - { cle: "3", libelle: "FRR « bénéficiaire »" }
      - { cle: "4", libelle: "Classée en partie" }
      - { cle: "5", libelle: "Bénéficiaire en partie" }
    ce_que_cest:
      - texte: "Créé par la loi de finances pour 2024 (article 73, qui crée l'article 44 quindecies A du code général des impôts), le zonage remplace les zones de revitalisation rurale (ZRR), instituées en 1995, et les zones de revitalisation des commerces en milieu rural."
        source: dgcl-faq-frr
      - texte: "Il a deux niveaux. Le « socle » concerne près de 20 000 communes : près de 17 800 classées, et près de 2 200 communes « bénéficiaires », anciennes ZRR non retenues qui en gardent les effets. Le niveau « plus », renforcé, réunit le quart des communes classées : 4 466 communes selon l'arrêté du 9 juillet 2025."
        source: dgcl-faq-frr
      - texte: "Les communes « bénéficiaires » devaient garder ces effets jusqu'au 31 décembre 2027 ; la loi de finances pour 2026 a reporté l'échéance au 31 décembre 2029."
        source: sp-frr-2026
    qui_decide:
      - texte: "Le Parlement fixe les critères, la densité de population et le revenu disponible par habitant, mesurés à l'échelle de l'intercommunalité, du bassin de vie ou du département ; une commune doit compter moins de 30 000 habitants. Dans treize départements peu denses et modestes, toutes les communes de moins de 30 000 habitants sont classées."
        source: dgcl-faq-frr
      - texte: "Le classement est constaté par arrêté : celui du 19 juin 2024, modifié le 14 avril 2025, pour le niveau « socle » et les communes « bénéficiaires » ; celui du 9 juillet 2025 pour le niveau « plus »."
        source: dgcl-faq-frr
      - texte: "Le niveau « plus » retient les communes rurales classées dont l'intercommunalité ou le bassin de vie a connu, de 2009 à 2020, l'évolution la plus défavorable du revenu, de la population et du taux d'emploi des 25-54 ans, d'après un indice fixé par le décret du 9 juillet 2025."
        source: dgcl-faq-frr
      - texte: "Les exonérations d'impôts locaux ne valent que si la commune et l'intercommunalité les délibèrent, chacune pour sa part."
        source: dgcl-faq-frr
    apporte:
      - texte: "Aux entreprises de moins de onze salariés créées ou reprises dans la zone, au régime réel d'imposition : une exonération d'impôt sur les bénéfices, et, sur délibération, de cotisation foncière des entreprises et de taxe foncière, totale pendant cinq ans puis dégressive pendant trois (75 %, 50 %, 25 %). En FRR « plus », plus d'entreprises et d'opérations y ont droit."
        source: dgcl-faq-frr
      - texte: "Aux employeurs de moins de cinquante salariés : une exonération de cotisations patronales pendant douze mois, pour l'embauche du premier au cinquantième salarié, totale jusqu'à 150 % du Smic."
        source: dgcl-faq-frr
      - texte: "À la commune : une majoration de 30 % de la fraction « bourg-centre » et de 20 % de la fraction « péréquation » de sa dotation de solidarité rurale, y compris pour les communes « bénéficiaires »."
        source: dgcl-faq-frr
      - texte: "Aux habitants, entre autres : l'ouverture d'une pharmacie par création possible, sous conditions, au-delà de 2 500 habitants, une concertation obligatoire avant de réviser la carte des formations du second degré, la prise en compte du classement dans la présence postale, et pas de surloyer dans les logements sociaux."
        source: dgcl-faq-frr
    cout:
      - texte: "L'exonération d'impôt sur les bénéfices était estimée à 10 millions d'euros pour 2025 dans l'évaluation des voies et moyens annexée au projet de loi de finances."
        source: vm-2025
      - texte: "Le maintien des communes « bénéficiaires » est estimé par le Gouvernement à plus de 40 millions d'euros par an pour le budget de l'État, jusqu'en 2035."
        source: an-qe-2635
      - texte: "Les exonérations d'impôts locaux sont payées par les collectivités qui les votent : elles renoncent à une recette."
        source: dgcl-faq-frr
    evaluations:
      - source: an-zrr-2014
        conclusion: "Sur les zones de revitalisation rurale, que France ruralités revitalisation remplace : le Conseil des prélèvements obligatoires conclut en 2010 que l'impact des dispositifs sur l'emploi « ne peut être établi de façon robuste » et que « les divers avantages ouverts dans les ZRR n'ont pas eu d'effet important sur l'emploi ou la création d'établissements »."
      - source: dgcl-faq-frr
        conclusion: "Les études et rapports parlementaires sur les ZRR partagent « le constat d'un dispositif perçu comme un signal positif de l'État et une reconnaissance de la vulnérabilité des territoires ruraux, tout en relevant son faible taux de recours par les entreprises, notamment en raison de la complexité des règles applicables »."
    sources:
      - { id: dgcl-faq-frr, titre: "Direction générale des collectivités locales — « France ruralités revitalisation », foire aux questions mise à jour en juillet 2025", url: "https://www.collectivites-locales.gouv.fr/files/files/3.%20Animer%20les%20territoires/5.%20La%20coh%C3%A9sion%20territoriale%20et%20l%27am%C3%A9nagement%20du%20territoire/FAQ%20FRR_MAJ%20juillet2025.pdf", consulte_le: 2026-11-13 }
      - { id: sp-frr-2026, titre: "Service Public Entreprendre — « Territoires ruraux (ZFRR, ZRR) et activités sédentaires : les nouveautés 2026 », 24 février 2026", url: "https://entreprendre.service-public.gouv.fr/actualites/A18076", consulte_le: 2026-11-13 }
      - { id: vm-2025, titre: "Évaluation des voies et moyens, tome 2 : dépenses fiscales, annexe au projet de loi de finances pour 2025 — mesure 220109", url: "https://www2.assemblee-nationale.fr/static/17/Annexes-DL/PLF-2025/Voies_et_moyens_Tome_2_2025.pdf", consulte_le: 2026-11-13 }
      - { id: an-qe-2635, titre: "Assemblée nationale — question écrite n° 2635, « France ruralités revitalisation en Saône-et-Loire », réponse publiée le 8 juillet 2025", url: "https://www.assemblee-nationale.fr/dyn/17/questions/QANR5L17QE2635", consulte_le: 2026-11-13 }
      - { id: an-zrr-2014, titre: "Assemblée nationale — rapport d'information n° 2251 sur les zones de revitalisation rurale, 8 octobre 2014", url: "https://www.assemblee-nationale.fr/14/pdf/rap-info/i2251.pdf", consulte_le: 2026-11-13 }
    verifie_le: 2026-11-13

  - id: quartiers-prioritaires
    cle: qpv
    nom: "Les quartiers prioritaires de la politique de la ville"
    nature: zonage
    lancement: 2015
    pilote: "L'Agence nationale de la cohésion des territoires, pour le ministère chargé de la ville"
    resume: "Les quartiers urbains aux revenus les plus bas, par rapport au pays et à leur agglomération : la géographie de la politique de la ville, dont les crédits et les dispositifs leur sont réservés. La liste a été refaite en 2024."
    liste: "la liste des quartiers prioritaires de 2024 de l'Agence nationale de la cohésion des territoires, rapportée aux communes"
    ce_que_cest:
      - texte: "Prévue par l'article 5 de la loi de programmation pour la ville et la cohésion urbaine du 21 février 2014, la géographie prioritaire a remplacé au 1er janvier 2015 les zones urbaines sensibles et les quartiers en contrat urbain de cohésion sociale. Une nouvelle génération est entrée en vigueur le 1er janvier 2024 dans l'Hexagone, par le décret n° 2023-1314 du 28 décembre 2023, et le 1er janvier 2025 en outre-mer."
        source: dg-qpv
      - texte: "1 609 quartiers prioritaires sont répertoriés dans l'Hexagone et l'outre-mer, où vivent 6 millions de personnes. Le taux de pauvreté y est de 44,3 %, contre 14,9 % dans l'ensemble du pays."
        source: anct-pv
    qui_decide:
      - texte: "Les critères sont fixés en application de la loi de 2014 : le nombre d'habitants, au moins 1 000, dans une unité urbaine de plus de 10 000 habitants, et un revenu médian par unité de consommation inférieur à la fois à celui du pays et à celui de l'unité urbaine. Pour la liste de 2024, l'INSEE et l'ANCT les ont appliqués aux données de 2019."
        source: an-qe-11864
      - texte: "Les contours ont été ajustés après les consultations des élus locaux par les préfets de département, puis la liste a été fixée par décret."
        source: an-qe-11864
    apporte:
      - texte: "Un contrat de ville, à l'échelle de l'intercommunalité ou de la commune, qui définit les besoins prioritaires des quartiers et la manière dont les politiques publiques y répondent."
        source: anct-pv
      - texte: "Les crédits de la politique de la ville (programme 147 du budget de l'État) pour des actions de proximité, et des programmes territorialisés comme les cités éducatives ou Entrepreneuriat Quartiers 2030."
        source: anct-pv
      - texte: "Le nouveau programme national de renouvellement urbain (2016-2034) prévoit de mobiliser 9 milliards d'euros de fonds publics, dont 1 milliard de crédits d'État."
        source: cc-qpv-2020
    cout:
      - texte: "Selon la Cour des comptes en 2020, l'État consacre environ 10 milliards d'euros par an à la politique de la ville, auxquels s'ajoutent la rénovation urbaine et les dépenses des collectivités, difficiles à mesurer."
        source: cc-qpv-2020
      - texte: "Le premier programme national de rénovation urbaine a mobilisé 12 milliards d'euros de fonds publics de 2003 à 2012, pour un investissement total de 46,1 milliards."
        source: cc-qpv-2020
    evaluations:
      - source: cc-qpv-2020
        conclusion: "La politique de la ville, qui suscite de très fortes attentes et mobilise des dépenses importantes, ne peut pas être évaluée dans sa globalité. […] En dix ans, l'attractivité résidentielle des quartiers prioritaires appréhendée de façon globale n'a pas réellement progressé. […] Dans les quartiers qui ont bénéficié du programme national de rénovation urbaine (PNRU), le cadre et les conditions de vie de leurs habitants se sont améliorés, parfois très sensiblement […], sans toutefois que l'image extérieure des quartiers ne se transforme."
    sources:
      - { id: dg-qpv, titre: "data.gouv.fr — « Quartiers prioritaires de la politique de la ville (QPV) », présentation du jeu de l'ANCT", url: "https://www.data.gouv.fr/datasets/5a561801c751df42d7fca9b6/", consulte_le: 2026-11-13 }
      - { id: anct-pv, titre: "Agence nationale de la cohésion des territoires — « Politique de la ville »", url: "https://anct.gouv.fr/programmes-dispositifs/politique-de-la-ville", consulte_le: 2026-11-13 }
      - { id: an-qe-11864, titre: "Assemblée nationale — question écrite n° 11864, « Moyens pour la politique de la ville à Paris », réponse du Gouvernement", url: "https://www.assemblee-nationale.fr/dyn/16/questions/QANR5L16QE11864", consulte_le: 2026-11-13 }
      - { id: cc-qpv-2020, titre: "Cour des comptes — « L'évaluation de l'attractivité des quartiers prioritaires », rapport public thématique, décembre 2020, synthèse", url: "https://www.ccomptes.fr/sites/default/files/2023-10/20201202-rapport-quartiers-prioritaires.pdf", consulte_le: 2026-11-13 }
    verifie_le: 2026-11-13

  - id: zone-tendue
    cle: tlv
    nom: "Les zones tendues"
    nature: zonage
    lancement: 2013
    pilote: "Le ministère chargé du logement"
    resume: "Les communes où l'offre de logements ne suit pas la demande, au sens de la taxe sur les logements vacants : une vingtaine de règles en dépendent, de la taxation des logements vides à l'encadrement des loyers."
    classes_nom: catégorie
    liste: "la liste des communes selon le zonage de la taxe sur les logements vacants du ministère chargé du logement"
    classes:
      - { cle: "1", libelle: "Zone tendue" }
      - { cle: "2", libelle: "Zone touristique et tendue" }
    ce_que_cest:
      - texte: "Défini à l'article 232 du code général des impôts, le zonage a été créé en 2013 puis refondu le 25 août 2023 pour répondre à la disparition des résidences permanentes dans les zones touristiques. Il classe les communes en deux catégories : tendues et non tendues."
        source: dg-tlv
      - texte: "Sont tendues les communes d'une unité urbaine de plus de 50 000 habitants où existe un déséquilibre marqué entre l'offre et la demande de logements ; et, depuis 2023, des communes hors de ces agglomérations où ce déséquilibre se traduit notamment par un taux élevé de résidences secondaires et des prix et des loyers élevés : les « communes tendues et touristiques »."
        source: dg-tlv
    qui_decide:
      - texte: "La liste est fixée par décret : le décret n° 2013-392 du 10 mai 2013, modifié, en dernier lieu par le décret n° 2025-1267 de décembre 2025, qui a tenu compte des fusions de communes."
        source: dgcl-thlv
    apporte:
      - texte: "Le zonage sert à plus d'une vingtaine de dispositions, parmi lesquelles la taxe sur les logements vacants, la taxe d'habitation sur les logements vacants, la majoration de la taxe d'habitation sur les résidences secondaires, l'encadrement des loyers, le plafonnement des honoraires des agents immobiliers à la charge des locataires, le changement d'usage des logements, l'obligation de logements sociaux de la loi SRU et le droit de réquisition."
        source: dg-tlv
      - texte: "En zone tendue, la taxe sur les logements vacants, perçue par l'État, s'applique de plein droit après un an de vacance, au taux de 17 % la première année et de 34 % ensuite. Ailleurs, la commune peut instituer par délibération une taxe d'habitation sur les logements vacants après deux ans de vacance. En zone tendue, elle peut majorer de 5 à 60 % la taxe d'habitation sur les résidences secondaires."
        source: dgcl-thlv
      - texte: "Au 1er janvier 2027, les deux taxes sont fusionnées en une taxe sur la vacance des locaux d'habitation perçue par le bloc communal (article 108 de la loi de finances pour 2026) : de plein droit en zone tendue, où la commune pourra relever les taux jusqu'à 30 % puis 60 % ; sur délibération ailleurs, au taux de 50 % au plus."
        source: dgcl-thlv
    cout:
      - texte: "Le zonage n'a pas de budget : il désigne où s'appliquent des taxes et des règles. La taxe sur les logements vacants est une recette, de l'État jusqu'en 2026, du bloc communal à partir de 2027."
        source: dgcl-thlv
    sans_evaluation: "Une évaluation de la politique de mobilisation des logements vacants a été publiée en 2016 ; le site n'a pas pu la lire depuis son environnement, et ne la cite donc pas. Aucune autre évaluation du zonage lui-même n'a été trouvée le 13 novembre 2026."
    sources:
      - { id: dg-tlv, titre: "Ministère chargé du logement — « Liste des communes selon le zonage TLV », présentation du jeu sur data.gouv.fr", url: "https://www.data.gouv.fr/datasets/657c88da2947e13be0597058/", consulte_le: 2026-11-13 }
      - { id: dgcl-thlv, titre: "Direction générale des collectivités locales — « Taxe d'habitation sur les logements vacants »", url: "https://www.collectivites-locales.gouv.fr/taxe-dhabitation-sur-les-logements-vacants", consulte_le: 2026-11-13 }
    verifie_le: 2026-11-13

  - id: territoires-d-industrie
    cle: ti
    nom: "Territoires d'industrie"
    nature: programme
    lancement: 2018
    pilote: "L'Agence nationale de la cohésion des territoires et la direction générale des entreprises"
    resume: "Un programme de soutien à l'industrie hors des métropoles : des intercommunalités labellisées, un binôme élu-industriel, un plan d'action, de l'ingénierie et des aides à l'investissement. 183 territoires pour 2023-2027."
    groupes_nom: territoires
    ce_que_cest:
      - texte: "Lancé en 2018 et renouvelé en 2023, le programme veut déployer une stratégie de reconquête industrielle « par et pour les territoires ». En novembre 2023, 183 territoires ont été labellisés, qui rassemblent 630 intercommunalités dans les 18 régions."
        source: anct-ti
      - texte: "Chaque territoire élabore un plan d'action évolutif, coconstruit par un binôme local élu-industriel, autour de quatre axes : innovation ; compétences et attractivité ; foncier ; transition écologique et énergétique."
        source: anct-ti
    qui_decide:
      - texte: "Le programme repose sur une collaboration entre les intercommunalités, la région et l'État, en partenariat avec France Industrie, Intercommunalités de France et Régions de France."
        source: anct-ti
      - texte: "Les aides à l'investissement du Fonds vert sont gérées par les préfectures de région, avec l'appui de l'Ademe et en concertation avec les conseils régionaux."
        source: dge-ti-2023
    apporte:
      - texte: "Le cofinancement de postes de chefs de projet, de l'ingénierie (des bureaux d'études pour concevoir des projets complexes) et des aides du Fonds vert aux investissements verts des entreprises."
        source: anct-ti
    cout:
      - texte: "Le Fonds vert a consacré 70 millions d'euros en 2024 aux projets d'investissement des entreprises des territoires ; plus de 4 millions d'euros d'ingénierie ont été mobilisés."
        source: anct-ti
      - texte: "Sur la première phase, de 2019 à 2023, les dispositifs des quatre principaux opérateurs de l'État pour les projets industriels de ces territoires représentent 1,7 milliard d'euros engagés et 794 millions effectivement versés. La Cour relève que les opérateurs n'ont pas intégré la géographie du programme dans leur activité."
        source: cc-ti-2024
    evaluations:
      - source: cc-ti-2024
        conclusion: "Le sondage réalisé par la Cour auprès des référents élus et industriels des Territoires d'industrie met en lumière l'effet positif du programme sur la coopération locale et les dynamiques de collaboration. […] Il ressort de l'évaluation réalisée par la Cour que la priorisation des Territoires d'industrie que le Gouvernement annonçait en 2018 n'a pas eu lieu, ni dans le nombre et le montant des interventions, ni dans les délais d'instruction des dossiers."
    sources:
      - { id: anct-ti, titre: "Agence nationale de la cohésion des territoires — « Territoires d'industrie »", url: "https://anct.gouv.fr/programmes-dispositifs/territoires-d-industrie", consulte_le: 2026-11-13 }
      - { id: dge-ti-2023, titre: "Direction générale des entreprises — « Territoires d'industrie : lancement du temps II 2023-2027 », 10 novembre 2023", url: "https://www.entreprises.gouv.fr/la-dge/actualites/territoires-dindustrie-lancement-du-temps-ii-2023-2027", consulte_le: 2026-11-13 }
      - { id: cc-ti-2024, titre: "Cour des comptes — « Le programme Territoires d'industrie 2018-2023 », évaluation de politique publique, novembre 2024, synthèse", url: "https://ccomptes.fr/sites/default/files/2024-11/20241121-synthese-Programme-Territoires-d-industrie.pdf", consulte_le: 2026-11-13 }
    verifie_le: 2026-11-13

  - id: contrats-pour-la-reussite-de-la-transition-ecologique
    cle: crte
    nom: "Les contrats pour la réussite de la transition écologique"
    nature: programme
    lancement: 2020
    pilote: "L'Agence nationale de la cohésion des territoires, avec le Commissariat général au développement durable"
    resume: "Un contrat entre l'État et les collectivités d'un bassin de vie, signé partout en France : la feuille de route commune des projets du territoire, et le cadre où l'État doit décliner la planification écologique."
    groupes_nom: contrats
    series: false
    ce_que_cest:
      - texte: "Créés en 2020 sous le nom de contrats de relance et de transition écologique, rebaptisés en 2023, les CRTE sont le cadre de référence du dialogue entre l'État et les collectivités à l'échelle des bassins de vie, sur la durée des mandats municipaux."
        source: min-crte
      - texte: "À leur lancement, 853 périmètres ont été définis par les préfets en concertation avec les élus, à 80 % à l'échelle d'une intercommunalité et à 20 % à l'échelle de plusieurs. 849 contrats sont signés : ce sont les premiers à couvrir tout le territoire à une échelle proche des bassins de vie."
        source: anct-crte
    qui_decide:
      - texte: "Les périmètres ont été définis par les préfets en concertation avec les élus locaux. Le contrat réunit l'État, les intercommunalités et les communes, et cherche à y associer les régions et les départements. Une instruction du 30 avril 2024 a relancé les contrats pour y décliner la planification écologique."
        source: anct-crte
    apporte:
      - texte: "Le contrat recense les projets du territoire et oriente ceux qui ont besoin d'un appui financier ou d'ingénierie vers l'aide la plus adaptée ; il permet, si besoin, de les prioriser dans le dialogue avec les services de l'État. Plus de 55 000 projets portés par les collectivités y sont engagés ou prévus."
        source: anct-crte
    cout:
      - texte: "Le contrat n'a pas de budget propre : il oriente vers les crédits existants de l'État et de ses opérateurs. En 2023, seul un tiers des projets financés par le Fonds vert était inscrit dans un CRTE, selon l'analyse de la Cour des comptes."
        source: cc-te-2025
    evaluations:
      - source: cc-te-2025
        conclusion: "Le bilan d'étape du déploiement des CRTE publié fin 2022 concluait à un manque de clarté dans leur animation […], à un financement des mesures du plan de relance principalement hors du cadre des CRTE et à la faiblesse des ambitions environnementales. […] À ce jour, 849 CRTE ont été signés, selon des formats très hétérogènes tant sur le fond que sur la forme. […] Aucun bilan des CRTE nouvelle génération et de leurs modalités de gouvernance ne peut donc être tiré à ce jour."
    sources:
      - { id: min-crte, titre: "Ministère de la Transition écologique — « Les contrats pour la réussite de la transition écologique (CRTE) », mis à jour le 13 mai 2025", url: "https://www.ecologie.gouv.fr/politiques-publiques/contrats-reussite-transition-ecologique-crte", consulte_le: 2026-11-13 }
      - { id: anct-crte, titre: "Agence nationale de la cohésion des territoires — « Contrats pour la réussite de la transition écologique »", url: "https://anct.gouv.fr/programmes-dispositifs/contrats-pour-la-reussite-de-la-transition-ecologique", consulte_le: 2026-11-13 }
      - { id: cc-te-2025, titre: "Cour des comptes — « La transition écologique », rapport public thématique, septembre 2025", url: "https://www.ccomptes.fr/sites/default/files/2025-10/20250916-Transition-ecologique.pdf", consulte_le: 2026-11-13 }
    verifie_le: 2026-11-13
