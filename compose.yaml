# L'ingestion dans Docker, sur un PC ou un serveur. Voir
# `docs/08-runner-auto-heberge.md`, section « Sur un PC, avec Docker ».
#
#   docker compose up -d runner         le runner auto-hébergé, à l'écoute
#   docker compose run --rm ingestion   l'ingestion à la main, dans ce dépôt
#   docker compose run --rm sonde       ce que cette connexion joint
#
# Les deux partagent le cache des gros fichiers (volume `rouages-cache`).
# Les secrets viennent de `.env`, jamais committé : voir `.env.exemple`.

x-image: &image
  # Compose vérifie l'image à chaque lancement et ne reconstruit que ce qui a
  # changé (Dockerfile, scripts) : sans `pull_policy: build`, il garde
  # l'image déjà construite, même périmée, et un correctif du dépôt n'y entre
  # pas (« bash\r », 16 novembre 2026). Sans attestation de provenance,
  # l'image garde le même identifiant tant que rien ne change : le runner
  # n'est pas recréé pour rien.
  build:
    context: docker/ingestion
    provenance: false
  image: rouages-ingestion
  pull_policy: build
  env_file:
    - path: .env
      required: false

services:
  runner:
    <<: *image
    user: node
    command: runner.sh
    restart: unless-stopped
    volumes:
      - rouages-runner:/home/node/runner
      - rouages-cache:/home/node/rouages-cache

  ingestion:
    <<: *image
    profiles: [main]
    entrypoint: dans-depot.sh
    command: ingerer.sh
    working_dir: /rouages
    volumes:
      - .:/rouages
      - rouages-cache:/rouages/.cache
      - rouages-modules:/rouages/node_modules

  sonde:
    <<: *image
    profiles: [main]
    entrypoint: dans-depot.sh
    working_dir: /rouages
    command: sh -c "npm ci --no-audit --no-fund --silent && npx tsx scripts/sonder-sources.ts"
    volumes:
      - .:/rouages
      - rouages-modules:/rouages/node_modules

volumes:
  rouages-runner:
  rouages-cache:
  rouages-modules:
