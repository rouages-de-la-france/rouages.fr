# Les oppositions reçues, appliquées à chaque ingestion (CLAUDE.md, « Les noms
# dans les données », condition 4).
#
# Des identifiants, jamais des noms : ce fichier est public, et y écrire le nom
# de qui demande à ne plus être nommé le nommerait une fois de plus. Les
# empreintes de conseillers sont des HMAC-SHA-256 ; la clé privée
# ROUAGES_RETRAITS_SECRET (au moins 32 octets aléatoires) ne doit jamais être
# publiée ni changée tant qu'une empreinte est conservée. Une
# demande arrive par le contact de l'éditeur (voir /signaler) ; on y inscrit
# l'identifiant et la date, et la collecte suivante cesse de nommer.
#
#   entreprises : le SIREN d'une entreprise — l'entreprise individuelle, ou la
#                 société quand c'est elle qui demande. Seul, il retire
#                 l'annonce du BODACC (elle reste comptée) ; avec un affichage,
#                 l'annonce reste, sans le nom de la personne :
#                   - siren: "123456789"
#                     affichage: commercial   # le seul nom commercial
#                   - siren: "123456789"
#                     affichage: anonyme      # « Entreprise individuelle »
#                 Un nom commercial qui contient un mot du prénom ou du nom, ou absent,
#                 donne une annonce anonyme. Le titulaire d'un marché ou
#                 l'exploitant d'un site n'est plus nommé dans tous les cas.
#                 Appliqué à l'ingestion, et dès le build pour les annonces
#                 du BODACC. Vérifié par `npm run verifier-retraits` ;
#   elus        : le code INSEE de la commune et la fonction, telle que le
#                 répertoire national des élus l'écrit (« Maire »,
#                 « 2ème adjoint au Maire ») ; pour un conseiller sans
#                 fonction, la commune et l'empreinte que calcule
#                 `npx tsx scripts/retraits.ts <commune> <NOM> <Prénom> <naissance>`
#                 avec ROUAGES_RETRAITS_SECRET défini dans l'environnement.
#   declarations: la page nominative de l'élu à la HATVP et la rubrique
#                 retirée (« activité du conjoint », « collaborateur »,
#                 « observation »…) — pour un conjoint ou un collaborateur qui
#                 demande à ne plus figurer, sans être nommé ici.
#   sites       : le code d'un site des sols pollués (« SSP… ») ou d'une
#                 installation classée (code AIOT, dix chiffres), pour un
#                 exploitant sans SIRET qui demande à ne plus être nommé.
#   rapprochements: la page nominative de l'élu à la HATVP et le SIREN du
#                 titulaire, pour un rapprochement par le nom signalé comme
#                 faux (deux sociétés de même nom) — lu au build, pas à
#                 l'ingestion : il disparaît dès la publication suivante.
#   deliberations: une délibération dont l'objet nomme quelqu'un que les
#                 filtres ont laissé passer — l'empreinte que calcule
#                 `npx tsx scripts/retraits.ts --deliberation <SIREN> <date> "<objet>"`,
#                 jamais l'objet. Retirée de la page de la commune, du journal
#                 et de la recherche à l'ingestion suivante.
entreprises:
  # Reçue le 17 novembre 2026 ; préfère garder le nom commercial.
  - siren: "103725149"
    affichage: commercial
  # Entrepreneur en diffusion partielle à SIRENE (annuaire des entreprises, constaté
  # le 21 novembre 2026) : il ne se nomme pas. La copie de SIRENE lue à l'ingestion,
  # mise à jour le 1er du mois, le disait encore diffusible. Retrait complet :
  # l'annonce reste comptée.
  - "103715736"
elus: []
declarations: []
sites: []
rapprochements: []
deliberations: []
